<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="store-title">Boutique الإيطالي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --accent-color: #000000;
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            transition: background 0.5s ease;
        }

        .font-vogue { font-family: 'Bodoni Moda', serif; }

        /* ستايل المنتجات الإيطالي: بسيط ونظيف */
        .product-card {
            border: none;
            transition: all 0.4s ease;
        }

        .img-wrapper {
            position: relative;
            overflow: hidden;
            background: #f8f8f8;
            aspect-ratio: 3/4;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover img {
            transform: scale(1.08);
        }

        /* زر الإضافة للسلة يظهر بنعومة */
        .add-to-cart-btn {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            text-align: center;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 2px;
            transition: bottom 0.3s ease;
        }

        .product-card:hover .add-to-cart-btn {
            bottom: 0;
        }

        /* تنسيق السلة الجانبية */
        #cart-sidebar {
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1000;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            transition: opacity 0.3s;
        }
        .btn-main:hover { opacity: 0.8; }
    </style>
</head>
<body class="pt-20">

    <nav class="fixed top-0 w-full z-[60] bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="container mx-auto px-6 py-5 flex justify-between items-center">
            <h1 id="nav-store-name" class="font-vogue text-2xl font-bold tracking-tighter uppercase">STUDIO</h1>
            
            <button onclick="toggleCart(true)" class="flex items-center gap-2">
                <span class="text-[10px] uppercase tracking-widest font-bold">الحقيبة</span>
                <span id="cart-count" class="text-xs font-light">(0)</span>
            </button>
        </div>
    </nav>

    <header class="py-20 text-center border-b border-gray-50">
        <h2 id="header-store-name" class="font-vogue text-6xl md:text-8xl italic mb-4">Collection</h2>
        <p id="store-bio" class="text-gray-400 uppercase tracking-[0.5em] text-[9px]"></p>
    </header>

    <main class="container mx-auto px-6 py-20">
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <div class="col-span-full text-center py-20 opacity-20 italic">جاري تحميل المجموعة...</div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-16">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center space-x-8 space-x-reverse mb-10 text-xl">
                <a id="link-instagram" href="#" class="hover:opacity-50"><i class="fa-brands fa-instagram"></i></a>
                <a id="link-facebook" href="#" class="hover:opacity-50"><i class="fa-brands fa-facebook"></i></a>
                <a id="link-tiktok" href="#" class="hover:opacity-50"><i class="fa-brands fa-tiktok"></i></a>
            </div>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest">© 2024 جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <div id="cart-overlay" class="fixed inset-0 bg-black/20 hidden z-[900]" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="fixed top-0 left-0 w-full max-w-sm h-full bg-white shadow-2xl translate-x-full p-8 flex flex-col text-right">
        <div class="flex justify-between items-center mb-10 border-b pb-5">
            <h2 class="font-vogue text-2xl italic">حقيبة التسوق</h2>
            <button onclick="toggleCart(false)"><i class="fa-solid fa-xmark text-gray-400"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-6">
            </div>
        <div class="mt-auto pt-8 border-t">
            <div class="flex justify-between font-bold mb-6">
                <span id="cart-total">0.00</span>
                <span>المجموع الإجمالي</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full btn-main py-4 text-xs uppercase tracking-widest font-bold">إتمام الطلب عبر واتساب</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. استخدام نفس الـ Config الخاص بكِ
        const firebaseConfig = {
          apiKey: "AIzaSyBEoyeQvUzFJviG2oYs5sZsAQ0bR9dHN0U",
          authDomain: "my-simple-stores.firebaseapp.com",
          projectId: "my-simple-stores",
          storageBucket: "my-simple-stores.firebasestorage.app",
          messagingSenderId: "280278183648",
          appId: "1:280278183648:web:65d99dceeab2be1584ea85"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. الحصول على كود المتجر من الرابط تلقائياً
        const urlParams = new URLSearchParams(window.location.search);
        const storeCode = urlParams.get('code');

        if (!storeCode) {
            document.body.innerHTML = "<div class='flex items-center justify-center h-screen font-vogue'>يرجى فتح المتجر باستخدام الرابط الصحيح (كود المتجر مفقود)</div>";
        }

        // 3. جلب بيانات المتجر والألوان
        async function initStore() {
            const doc = await db.collection('stores').doc(storeCode).get();
            if (doc.exists) {
                const store = doc.data();
                
                // تحديث الألوان من لوحة الإدارة
                if(store.colors) {
                    document.documentElement.style.setProperty('--accent-color', store.colors.primary);
                    document.documentElement.style.setProperty('--bg-color', store.colors.background);
                    document.documentElement.style.setProperty('--text-color', store.colors.text);
                }

                // تحديث النصوص
                document.getElementById('nav-store-name').innerText = store.name;
                document.getElementById('header-store-name').innerText = store.name;
                document.getElementById('store-title').innerText = store.name;
                document.getElementById('store-bio').innerText = store.info?.bio || "";
                
                // تحديث روابط التواصل
                if(store.info?.social) {
                    if(store.info.social.instagram) document.getElementById('link-instagram').href = store.info.social.instagram;
                    if(store.info.social.facebook) document.getElementById('link-facebook').href = store.info.social.facebook;
                    if(store.info.social.tiktok) document.getElementById('link-tiktok').href = store.info.social.tiktok;
                }

                loadProducts();
            }
        }

        // 4. جلب المنتجات من الـ Sub-collection (كما في app.js)
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const snapshot = await db.collection('stores').doc(storeCode).collection('products').get();
            
            if(snapshot.empty) {
                grid.innerHTML = "<p class='col-span-full text-center opacity-40 italic'>لا توجد منتجات حالياً</p>";
                return;
            }

            grid.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-wrapper group">
                            <img src="${p.image || ''}" alt="${p.name}">
                            <button onclick="addToCart('${doc.id}', '${p.name}', ${p.price}, '${p.image}')" class="add-to-cart-btn">إضافة للحقيبة +</button>
                        </div>
                        <div class="mt-6 text-center">
                            <h3 class="font-vogue text-xl uppercase tracking-tighter">${p.name}</h3>
                            <p class="text-sm font-light mt-2">${p.price} ر.س</p>
                        </div>
                    </div>
                `;
            });
        }

        // 5. نظام السلة المبسط
        let cart = [];
        function addToCart(id, name, price, img) {
            const item = cart.find(i => i.id === id);
            if(item) item.qty++;
            else cart.push({id, name, price, img, qty: 1});
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += (item.price * item.qty);
                return `
                    <div class="flex items-center gap-4 border-b pb-4">
                        <img src="${item.img}" class="w-16 h-20 object-cover">
                        <div class="flex-grow">
                            <h4 class="font-vogue text-sm italic">${item.name}</h4>
                            <p class="text-[10px] text-gray-400 mt-1">${item.price} ر.س × ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-xs text-gray-300">حذف</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toFixed(2) + " ر.س";
            document.getElementById('cart-count').innerText = `(${cart.reduce((a, b) => a + b.qty, 0)})`;
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }

        function toggleCart(show) {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.style.transform = show ? "translateX(0)" : "translateX(100%)";
            overlay.style.display = show ? "block" : "none";
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("السلة فارغة");
            let message = "طلب جديد من المتجر:\n\n";
            cart.forEach(item => message += `- ${item.name} (الكمية: ${item.qty})\n`);
            message += `\nالمجموع: ${document.getElementById('cart-total').innerText}`;
            window.open(`https://wa.me/213000000000?text=${encodeURIComponent(message)}`);
        }

        initStore();
    </script>
</body>
</html>
