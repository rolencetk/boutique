<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --main-color: #000000; 
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Montserrat', sans-serif;
            transition: all 0.5s ease;
        }
        
        .font-italy { font-family: 'Bodoni Moda', serif; }
        
        #cart-sidebar {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--bg-color);
            color: var(--text-color);
            border-left: 1px solid rgba(0,0,0,0.05);
        }

        .product-card img { transition: transform 0.8s ease; }
        .product-card:hover img { transform: scale(1.05); }

        .btn-accent {
            background-color: var(--main-color);
            color: white; /* Contrast usually looks best in white for dark accents */
            filter: brightness(1);
        }
        
        /* Loading Skeletons */
        .skeleton { background: #f0f0f0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="pt-24">

    <nav class="fixed w-full top-0 z-[60] bg-white/70 backdrop-blur-lg border-b border-gray-50">
        <div class="container mx-auto px-8 py-6 flex justify-between items-center">
            <h1 id="store-name" class="font-italy text-2xl font-bold tracking-tighter uppercase">Store</h1>
            
            <button onclick="toggleCart(true)" class="relative flex items-center gap-2">
                <span class="text-[10px] uppercase tracking-widest font-bold border-b border-current">Cart</span>
                <span id="cart-count" class="text-[10px] font-bold">0</span>
            </button>
        </div>
    </nav>

    <header class="py-24 text-center">
        <h2 id="store-bio" class="font-italy text-5xl md:text-7xl italic mb-4">The Collection</h2>
        <p id="store-tagline" class="text-gray-400 uppercase tracking-[0.4em] text-[9px] px-4"></p>
    </header>

    <main class="container mx-auto px-8 pb-32">
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-20">
            </div>
    </main>

    <footer class="py-20 border-t border-gray-100 text-center">
        <div id="social-links" class="flex justify-center gap-10 mb-8 text-[11px] uppercase tracking-widest opacity-60">
            </div>
        <p class="text-[9px] text-gray-300 uppercase tracking-widest">&copy; <span id="year"></span> All Rights Reserved</p>
    </footer>

    <div id="cart-overlay" class="fixed inset-0 bg-black/10 z-[100] hidden backdrop-blur-sm" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 w-full max-w-sm h-full z-[101] translate-x-full p-10 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-12">
            <h2 class="font-italy text-3xl italic">Your Bag</h2>
            <button onclick="toggleCart(false)"><i class="fa-solid fa-xmark text-gray-400"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-8"></div>
        <div class="mt-auto pt-8 border-t border-gray-100">
            <div class="flex justify-between text-xs uppercase tracking-widest mb-6">
                <span>Total</span>
                <span id="cart-total" class="font-bold">$0.00</span>
            </div>
            <button onclick="checkout()" class="w-full btn-accent py-5 text-[10px] uppercase tracking-[0.3em] font-bold">Checkout</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIG ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get Store Code from URL (e.g., store.html?code=STR-XXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const storeCode = urlParams.get('code') || "PASTE_A_DEFAULT_CODE_HERE_FOR_TESTING";

        // --- 2. DYNAMIC THEME & INFO ---
        db.collection("stores").doc(storeCode).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                
                // Set Theme Colors (From Admin Panel structure)
                if(data.colors) {
                    document.documentElement.style.setProperty('--main-color', data.colors.primary);
                    document.documentElement.style.setProperty('--bg-color', data.colors.background);
                    document.documentElement.style.setProperty('--text-color', data.colors.text);
                }

                // Set Information (From Client Dashboard structure)
                document.getElementById('store-name').innerText = data.info?.name || data.name || "BOUTIQUE";
                document.getElementById('page-title').innerText = data.info?.name || data.name;
                document.getElementById('store-bio').innerText = data.info?.bio || "The Collection";
                document.getElementById('store-tagline').innerText = data.info?.description || "";

                // Social Links
                const socialContainer = document.getElementById('social-links');
                socialContainer.innerHTML = '';
                if(data.info?.social) {
                    Object.entries(data.info.social).forEach(([platform, url]) => {
                        if(url) socialContainer.innerHTML += `<a href="${url}" target="_blank" class="hover:opacity-50">${platform}</a>`;
                    });
                }
            }
        });

        // --- 3. PRODUCTS LOAD (From Sub-collection) ---
        db.collection("stores").doc(storeCode).collection("products").onSnapshot(snapshot => {
            const container = document.getElementById('products-container');
            container.innerHTML = "";
            
            if(snapshot.empty) {
                container.innerHTML = `<p class="col-span-full text-center text-[10px] uppercase opacity-30 py-20">New items arriving soon</p>`;
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                container.innerHTML += `
                    <div class="product-card group cursor-pointer">
                        <div class="relative aspect-[3/4] overflow-hidden bg-gray-50 mb-6">
                            <img src="${p.image || ''}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <button onclick="addToCart('${doc.id}', '${p.name}', ${p.price}, '${p.image}')" 
                                    class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur py-5 text-[9px] uppercase tracking-widest font-bold translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                                Add to Bag
                            </button>
                        </div>
                        <div class="text-center">
                            <h3 class="font-italy text-xl mb-1">${p.name}</h3>
                            <p class="text-[10px] font-medium opacity-40">$${p.price}</p>
                        </div>
                    </div>
                `;
            });
        });

        // --- 4. CART & CHECKOUT ---
        let cart = [];
        function addToCart(id, name, price, img) {
            const item = cart.find(i => i.id === id);
            item ? item.qty++ : cart.push({id, name, price, img, qty: 1});
            updateUI();
            toggleCart(true);
        }

        function updateUI() {
            const itemsDiv = document.getElementById('cart-items');
            let total = 0, count = 0;
            itemsDiv.innerHTML = cart.map((item, index) => {
                total += item.price * item.qty;
                count += item.qty;
                return `
                    <div class="flex gap-6 items-start">
                        <img src="${item.img}" class="w-16 h-20 object-cover bg-gray-50">
                        <div class="flex-grow">
                            <h4 class="font-italy text-md italic">${item.name}</h4>
                            <p class="text-[10px] opacity-40 mt-1 uppercase italic">$${item.price} &times; ${item.qty}</p>
                        </div>
                        <button onclick="removeItem(${index})" class="text-gray-300 hover:text-black transition"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-count').innerText = count;
        }

        function removeItem(i) { cart.splice(i, 1); updateUI(); }
        function toggleCart(s) { 
            document.getElementById('cart-sidebar').style.transform = s ? "translateX(0)" : "translateX(100%)";
            document.getElementById('cart-overlay').classList.toggle('hidden', !s);
        }
        document.getElementById('year').innerText = new Date().getFullYear();

        function checkout() {
            if(cart.length === 0) return;
            let msg = `New Order from ${document.getElementById('store-name').innerText}:\n\n`;
            cart.forEach(i => msg += `- ${i.name} (x${i.qty})\n`);
            msg += `\nTotal: ${document.getElementById('cart-total').innerText}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
