<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="store-name-title">متجري التقني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* تعريف متغير اللون الأساسي الذي سيتم تغييره من لوحة التحكم */
        :root { --main-color: #000000; }
        .bg-main { background-color: var(--main-color); }
        .text-main { color: var(--main-color); }
        .border-main { border-color: var(--main-color); }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body>

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4 space-x-reverse">
                <img id="store-logo" src="https://via.placeholder.com/40" alt="Logo" class="h-10 w-10 object-contain">
                <h1 id="store-name" class="text-2xl font-bold text-gray-800">تحميل...</h1>
            </div>
            
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping text-2xl text-gray-700"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-main text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <header class="bg-black text-white py-20 px-6 text-center">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-4">اكتشف التكنولوجيا المستقبلية</h2>
        <p class="text-gray-400 max-w-2xl mx-auto">أفضل المنتجات التقنية المختارة بعناية لتناسب أسلوب حياتك العصري.</p>
    </header>

    <main class="container mx-auto px-6 py-12">
        <h3 class="text-2xl font-bold text-gray-800 mb-8 border-r-4 border-main pr-4">أحدث المنتجات</h3>
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <div class="animate-pulse bg-gray-200 h-64 rounded-lg"></div>
            <div class="animate-pulse bg-gray-200 h-64 rounded-lg"></div>
            <div class="animate-pulse bg-gray-200 h-64 rounded-lg"></div>
        </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[100] flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold">سلة التسوق</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cart-items" class="space-y-4">
                </div>
            <div class="mt-8 border-t pt-6">
                <div class="flex justify-between text-xl font-bold mb-6">
                    <span>إجمالي المبلغ:</span>
                    <span id="cart-total">0 $</span>
                </div>
                <button class="w-full bg-main text-white py-4 rounded-lg font-bold hover:opacity-90 transition">إتمام الطلب عبر واتساب</button>
            </div>
        </div>
    </div>

    <script>
        // --- إعدادات Firebase (ضع إعداداتك هنا) ---
        const firebaseConfig = { /* انسخ إعداداتك هنا */ };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- جلب إعدادات المتجر (اسم، لون، شعار) ---
        db.collection("settings").doc("store_info").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById("store-name").innerText = data.name;
                document.getElementById("store-name-title").innerText = data.name;
                document.getElementById("store-logo").src = data.logo;
                document.documentElement.style.setProperty('--main-color', data.themeColor);
            }
        });

        // --- جلب المنتجات بتصميم عصري ---
        db.collection("products").onSnapshot((snapshot) => {
            const container = document.getElementById("products-container");
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const p = doc.data();
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 border border-gray-100 group">
                        <div class="relative overflow-hidden rounded-lg mb-4">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover group-hover:scale-110 transition duration-500">
                        </div>
                        <h4 class="text-lg font-bold text-gray-800 mb-2">${p.name}</h4>
                        <div class="flex justify-between items-center">
                            <span class="text-main font-bold text-xl">${p.price} $</span>
                            <button onclick="addToCart('${doc.id}', '${p.name}', ${p.price}, '${p.image}')" 
                                    class="bg-gray-100 p-2 rounded-full hover:bg-main hover:text-white transition">
                                <i class="fa-solid fa-plus px-2"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        });

        // --- نظام سلة التسوق البسيط ---
        let cart = [];
        function addToCart(id, name, price, img) {
            cart.push({id, name, price, img});
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById("cart-count").innerText = cart.length;
            const cartItems = document.getElementById("cart-items");
            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex items-center space-x-4 space-x-reverse border-b pb-4">
                        <img src="${item.img}" class="w-16 h-16 rounded object-cover">
                        <div class="flex-1">
                            <h5 class="font-bold">${item.name}</h5>
                            <p class="text-main">${item.price} $</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById("cart-total").innerText = total + " $";
        }

        function toggleCart() {
            document.getElementById("cart-modal").classList.toggle("hidden");
        }
    </script>
</body>
</html>
