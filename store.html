<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #6366f1; --bg: #ffffff; --text: #1f2937; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--primary); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .social-links a { color: white; margin-right: 1rem; font-size: 1.2rem; text-decoration: none; }
        .hero { text-align: center; padding: 3rem 5%; background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .hero p { opacity: 0.9; }
        .categories { padding: 2rem 5%; display: flex; gap: 1rem; overflow-x: auto; }
        .cat-btn { padding: 0.6rem 1.5rem; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 25px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--primary); color: white; }
        .products { padding: 2rem 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .product { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .product:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 1rem; }
        .product-name { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .old-price { text-decoration: line-through; color: #9ca3af; font-size: 0.9rem; margin-right: 0.5rem; }
        .product-sizes, .product-colors { font-size: 0.85rem; color: #6b7280; margin-top: 0.5rem; }
        .btn-buy { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 8px; margin-top: 1rem; cursor: pointer; }
        footer { background: #1f2937; color: white; text-align: center; padding: 2rem; margin-top: 3rem; }
        .loading { text-align: center; padding: 3rem; }
        @media (max-width: 768px) { .hero h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <header>
        <div class="logo" id="storeLogo">🛒 متجر</div>
        <div class="social-links" id="socialLinks"></div>
    </header>
    <div id="hero" class="hero"><h1 id="storeName">متجرنا</h1><p id="storeDesc">أفضل المنتجات بأفضل الأسعار</p></div>
    <div class="categories" id="categories"><button class="cat-btn active" onclick="filterProducts('all')">الكل</button></div>
    <div class="products" id="products"><div class="loading">جاري تحميل المنتجات...</div></div>
    <footer><p id="footerText">© 2024</p></footer>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeCode = urlParams.get('code');
        if(!storeCode) { document.getElementById('products').innerHTML = '<p style="text-align:center;padding:2rem;">رابط المتجر غير صحيح</p>'; throw new Error('No store code'); }
        async function loadStore() {
            const store = await getStoreInfo(storeCode);
            if(!store) { document.getElementById('products').innerHTML = '<p style="text-align:center;padding:2rem;">المتجر غير موجود</p>'; return; }
            document.documentElement.style.setProperty('--primary', store.colors?.primary || '#6366f1');
            document.getElementById('storeName').textContent = store.info?.name || 'متجر';
            document.getElementById('storeDesc').textContent = store.info?.bio || '';
            document.getElementById('storeLogo').textContent = store.info?.name?.charAt(0) || '🛒';
            const social = store.info?.social || {};
            document.getElementById('socialLinks').innerHTML = social.facebook ? `<a href="${social.facebook}" target="_blank">📘</a>` : '';
            document.getElementById('socialLinks').innerHTML += social.instagram ? `<a href="${social.instagram}" target="_blank">📷</a>` : '';
            document.getElementById('socialLinks').innerHTML += social.tiktok ? `<a href="${social.tiktok}" target="_blank">🎵</a>` : '';
            const cats = store.categories || [];
            const catContainer = document.getElementById('categories');
            catContainer.innerHTML = '<button class="cat-btn active" onclick="filterProducts(\'all\')">الكل</button>';
            cats.forEach(c => { catContainer.innerHTML += `<button class="cat-btn" onclick="filterProducts('${c}')">${c}</button>`; });
            const prods = await getProducts(storeCode);
            window.allProducts = prods;
            displayProducts(prods);
        }
        function displayProducts(prods) {
            const container = document.getElementById('products');
            if(prods.length === 0) { container.innerHTML = '<p style="text-align:center;padding:2rem;">لا توجد منتجات حالياً</p>'; return; }
            container.innerHTML = prods.map(p => `<div class="product"><img src="${p.image || 'https://via.placeholder.com/250'}" class="product-img"><div class="product-info"><div class="product-name">${p.name}</div>${p.oldPrice ? `<span class="old-price">${p.oldPrice} ر.س</span>` : ''}<span class="product-price">${p.price} ر.س</span>${p.sizes ? `<div class="product-sizes">المقاسات: ${p.sizes}</div>` : ''}${p.colors ? `<div class="product-colors">الألوان: ${p.colors}</div>` : ''}<button class="btn-buy" onclick="order('${p.name}', '${p.price}')">اطلب الآن</button></div></div>`).join('');
        }
        function filterProducts(cat) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); if(cat === 'all') displayProducts(window.allProducts); else displayProducts(window.allProducts.filter(p => p.category === cat)); }
        function order(name, price) { const sheetUrl = 'https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/edit'; window.open(sheetUrl, '_blank'); }
        loadStore();
    </script>
</body>
</html>
