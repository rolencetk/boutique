<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="store-title">Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --primary: #000; --bg: #fff; --text: #1a1a1a; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; transition: 0.5s; }
        .font-vogue { font-family: 'Bodoni Moda', serif; }
        
        nav { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.05); position: fixed; top: 0; width: 100%; z-index: 1000; }
        .bio-bar { background: var(--primary); color: var(--bg); font-size: 9px; text-transform: uppercase; letter-spacing: 2px; padding: 10px; text-align: center; }
        
        .form-input { width: 100%; padding: 14px; border: 1px solid #eee; font-size: 11px; margin-bottom: 10px; background: transparent; outline: none; }
        .form-input:focus { border-color: var(--primary); }
        
        .delivery-card { border: 1px solid #eee; padding: 12px; cursor: pointer; text-align: center; font-size: 10px; transition: 0.3s; }
        .delivery-card.active { border-color: var(--primary); background: var(--primary); color: var(--bg); }

        .btn-main { background: var(--primary); color: var(--bg); width: 100%; padding: 20px; font-size: 11px; letter-spacing: 4px; font-weight: 600; text-transform: uppercase; }
        
        #product-modal .modal-content { background: var(--bg); transform: translateY(30px); opacity: 0; transition: 0.4s ease; }
        #product-modal.active .modal-content { transform: translateY(0); opacity: 1; }
        
        #cart-sidebar { transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); background: var(--bg); z-index: 2100; }
        .old-price { text-decoration: line-through; opacity: 0.3; font-size: 0.8em; margin-right: 8px; }

        /* تعديل حجم الشعار ليكون واضحاً */
        #store-logo {
            max-height: 60px; 
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="pt-24">

    <nav>
        <div id="store-bio-small" class="bio-bar">LUXURY COLLECTION</div>
        <div class="grid grid-cols-2 items-center px-10 py-5">
            <div class="text-left flex items-center">
                <img id="store-logo" src="" class="hidden">
                <div class="text-left font-vogue text-xl uppercase tracking-tighter hidden" id="nav-store-name">Studio</div>
            </div>
            
            <div class="text-right">
                <button onclick="toggleCart(true)" class="flex items-center gap-2 justify-end w-full">
                    <span id="cart-count" class="text-[9px] font-bold uppercase tracking-widest">Bag (0)</span>
                    <i class="fa-solid fa-bag-shopping text-sm"></i>
                </button>
            </div>
        </div>
    </nav>

    <header class="pt-24 pb-12 text-center">
        <h2 id="header-store-name" class="font-vogue text-7xl md:text-9xl italic mb-3 uppercase tracking-tighter tracking-tight">Boutique</h2>
        <p id="store-description" class="text-[10px] uppercase tracking-[0.5em] opacity-30 max-w-lg mx-auto leading-relaxed px-6"></p>
    </header>

    <main class="container mx-auto px-10 py-20">
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-20"></div>
    </main>

    <div id="product-modal" class="fixed inset-0 bg-black/20 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="modal-content w-full max-w-5xl h-auto max-h-[90vh] overflow-y-auto flex flex-col md:flex-row shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 z-10 opacity-30 hover:opacity-100"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="md:w-1/2 bg-[#fafafa]"><img id="modal-img" src="" class="w-full h-full object-cover aspect-[3/4]"></div>
            <div class="md:w-1/2 p-10 md:p-16 flex flex-col">
                <h2 id="modal-name" class="font-vogue text-5xl mb-4 italic tracking-tighter"></h2>
                <div class="mb-8"><span id="modal-old-price" class="old-price"></span><span id="modal-price" class="text-2xl font-light"></span></div>
                <p id="modal-desc" class="text-xs leading-relaxed opacity-50 mb-10 italic"></p>
                <div id="color-section" class="mb-8">
                    <p class="text-[9px] uppercase tracking-widest mb-4 font-bold">Color Selection</p>
                    <div id="modal-colors" class="flex gap-4"></div>
                </div>
                <div id="size-section" class="mb-10">
                    <p class="text-[9px] uppercase tracking-widest mb-4 font-bold">Size Selection</p>
                    <div id="modal-sizes" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="mt-auto flex items-center gap-6">
                    <div class="flex items-center border border-gray-100">
                        <button onclick="updateQty(-1)" class="px-5 py-4 text-sm">-</button>
                        <span id="modal-qty" class="w-10 text-center text-xs font-bold">1</span>
                        <button onclick="updateQty(1)" class="px-5 py-4 text-sm">+</button>
                    </div>
                    <button id="add-to-cart-final" class="btn-main">Add to Bag</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-24 border-t border-gray-50 text-center">
        <div id="social-links" class="flex justify-center gap-12 mb-10 text-xl opacity-40"></div>
        <p class="text-[9px] uppercase tracking-[0.5em] opacity-20">&copy; 2024 Signature Suite</p>
    </footer>

    <div id="cart-overlay" class="fixed inset-0 bg-black/10 hidden z-[2050] backdrop-blur-sm" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 w-full max-w-md h-full translate-x-full p-10 flex flex-col shadow-2xl overflow-y-auto">
        <div class="flex justify-between items-center mb-12">
            <h2 class="font-vogue text-4xl italic tracking-tighter">Shopping Bag</h2>
            <button onclick="toggleCart(false)"><i class="fa-solid fa-xmark opacity-20 hover:opacity-100"></i></button>
        </div>

        <div id="cart-items" class="space-y-6 mb-12 border-b border-gray-50 pb-10"></div>

        <div class="space-y-6">
            <h3 class="text-[10px] uppercase tracking-widest font-bold opacity-30">Customer Details</h3>
            <input type="text" id="cust-name" class="form-input" placeholder="Full Name">
            <input type="tel" id="cust-phone" class="form-input" placeholder="Phone Number">
            
            <select id="cust-wilaya" class="form-input" onchange="updateShipping()">
                <option value="">Select Wilaya</option>
            </select>

            <div id="delivery-box" class="grid grid-cols-2 gap-2 hidden">
                <div id="opt-home" class="delivery-card" onclick="selectShip('home')">Home <br> <span id="p-home"></span> DA</div>
                <div id="opt-office" class="delivery-card" onclick="selectShip('office')">Office <br> <span id="p-office"></span> DA</div>
            </div>

            <select id="pay-method" class="form-input">
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="BaridiMob">BaridiMob</option>
                <option value="Paysera">Paysera / Wise</option>
            </select>
        </div>

        <div class="mt-12 pt-8 border-t border-gray-100">
            <div class="flex justify-between mb-8">
                <span class="text-[10px] uppercase opacity-40">Total Amount</span>
                <span id="cart-total" class="font-bold text-2xl">0 DA</span>
            </div>
            <button id="send-btn" onclick="submitOrder()" class="btn-main">Send Order</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBEoyeQvUzFJviG2oYs5sZsAQ0bR9dHN0U",
          authDomain: "my-simple-stores.firebaseapp.com",
          projectId: "my-simple-stores",
          storageBucket: "my-simple-stores.firebasestorage.app",
          messagingSenderId: "280278183648",
          appId: "1:280278183648:web:65d99dceeab2be1584ea85"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const params = new URLSearchParams(window.location.search);
        const storeCode = params.get('code');
        let storeData, currentQty = 1, selectedS = "", selectedC = "", shipType = 'home', shipPrice = 0, cart = [];

        async function init() {
            if(!storeCode) return;
            db.collection('stores').doc(storeCode).onSnapshot(doc => {
                if(doc.exists) {
                    storeData = doc.data();
                    applyTheme(storeData);
                    loadProducts();
                    setupWilayas();
                }
            });
        }

        function applyTheme(data) {
            document.documentElement.style.setProperty('--primary', data.colors.primary);
            document.documentElement.style.setProperty('--bg', data.colors.background);
            document.documentElement.style.setProperty('--text', data.colors.text);
            
            // تحديث العناوين
            document.getElementById('header-store-name').innerText = data.name;
            document.getElementById('store-description').innerText = data.info?.description || "";
            document.getElementById('store-bio-small').innerText = data.info?.bio || "Signature Suite";
            
            // إظهار الشعار في جهة اليسار
            const logoUrl = data.logo || data.info?.logo;
            if(logoUrl) { 
                const logoImg = document.getElementById('store-logo');
                logoImg.src = logoUrl; 
                logoImg.classList.remove('hidden'); 
                document.getElementById('nav-store-name').classList.add('hidden'); 
            } else {
                // إذا لم يوجد شعار يظهر الاسم
                document.getElementById('nav-store-name').classList.remove('hidden');
            }
            
            const soc = document.getElementById('social-links'); soc.innerHTML = '';
            if(data.info?.social) Object.entries(data.info.social).forEach(([k,v]) => { if(v) soc.innerHTML += `<a href="${v}"><i class="fa-brands fa-${k}"></i></a>`; });
        }

        function setupWilayas() {
            const sel = document.getElementById('cust-wilaya');
            sel.innerHTML = '<option value="">Select Wilaya</option>';
            if(storeData.delivery) Object.keys(storeData.delivery).forEach(w => sel.innerHTML += `<option value="${w}">${w}</option>`);
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const snap = await db.collection('stores').doc(storeCode).collection('products').get();
            grid.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                grid.innerHTML += `
                    <div class="product-card cursor-pointer" onclick='openP(${JSON.stringify({id: doc.id, ...p}).replace(/'/g, "&apos;")})'>
                        <div class="aspect-[3/4] mb-8 overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover hover:scale-105 transition duration-700"></div>
                        <div class="text-center font-vogue italic text-2xl">${p.name}</div>
                        <div class="text-center text-[10px] mt-2">${p.oldPrice ? `<span class="old-price">${p.oldPrice} DA</span>` : ''} ${p.price} DA</div>
                    </div>`;
            });
        }

        function openP(p) {
            currentQty = 1; selectedS = ""; selectedC = "";
            document.getElementById('modal-img').src = p.image;
            document.getElementById('modal-name').innerText = p.name;
            document.getElementById('modal-price').innerText = p.price + " DA";
            document.getElementById('modal-old-price').innerText = p.oldPrice ? p.oldPrice + " DA" : "";
            document.getElementById('modal-desc').innerText = p.description || "";
            document.getElementById('modal-qty').innerText = "1";
            
            const sz = document.getElementById('modal-sizes'); sz.innerHTML = "";
            if(p.sizes) p.sizes.split(',').forEach(s => sz.innerHTML += `<div class="p-2 border border-gray-100 text-[10px] cursor-pointer" onclick="selectS(this, '${s.trim()}')">${s.trim()}</div>`);
            
            const cl = document.getElementById('modal-colors'); cl.innerHTML = "";
            if(p.colors) p.colors.split(',').forEach(c => cl.innerHTML += `<div class="w-6 h-6 rounded-full border border-gray-200 cursor-pointer" style="background:${c.trim()}" onclick="selectC(this, '${c.trim()}')"></div>`);

            document.getElementById('product-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('product-modal').classList.add('active'), 10);
            
            document.getElementById('add-to-cart-final').onclick = () => {
                cart.push({ ...p, qty: currentQty, size: selectedS, color: selectedC });
                updateCart(); closeModal(); toggleCart(true);
            };
        }

        function selectS(el, s) { document.querySelectorAll('#modal-sizes div').forEach(d => d.style.borderColor = '#eee'); el.style.borderColor = 'var(--primary)'; selectedS = s; }
        function selectC(el, c) { document.querySelectorAll('#modal-colors div').forEach(d => d.style.transform = 'scale(1)'); el.style.transform = 'scale(1.3)'; selectedC = c; }
        function updateQty(v) { currentQty = Math.max(1, currentQty + v); document.getElementById('modal-qty').innerText = currentQty; }
        function closeModal() { document.getElementById('product-modal').classList.remove('active'); setTimeout(() => document.getElementById('product-modal').classList.add('hidden'), 400); }

        function updateShipping() {
            const w = document.getElementById('cust-wilaya').value;
            const box = document.getElementById('delivery-box');
            if(w && storeData.delivery[w]) {
                box.classList.remove('hidden');
                document.getElementById('p-home').innerText = storeData.delivery[w].home;
                document.getElementById('p-office').innerText = storeData.delivery[w].office;
                selectShip(shipType);
            } else { box.classList.add('hidden'); shipPrice = 0; updateCart(); }
        }

        function selectShip(t) {
            shipType = t; shipPrice = parseFloat(storeData.delivery[document.getElementById('cust-wilaya').value][t]);
            document.getElementById('opt-home').classList.toggle('active', t==='home');
            document.getElementById('opt-office').classList.toggle('active', t==='office');
            updateCart();
        }

        function updateCart() {
            const cont = document.getElementById('cart-items');
            let sub = 0;
            cont.innerHTML = cart.map((i, idx) => {
                sub += (i.price * i.qty);
                return `<div class="flex gap-4 text-xs items-center">
                    <img src="${i.image}" class="w-14 h-20 object-cover">
                    <div class="flex-grow"><b>${i.name}</b><br><span class="opacity-40">${i.size} | ${i.color}</span><br>${i.price} DA x ${i.qty}</div>
                    <button onclick="cart.splice(${idx},1);updateCart()">×</button>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = (sub + shipPrice) + " DA";
            document.getElementById('cart-count').innerText = `Bag (${cart.length})`;
        }

        function toggleCart(s) { document.getElementById('cart-sidebar').style.transform = s ? "translateX(0)" : "translateX(100%)"; document.getElementById('cart-overlay').classList.toggle('hidden', !s); }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const wilaya = document.getElementById('cust-wilaya').value;
            if(!name || !phone || !wilaya || cart.length === 0) return alert("Please complete info");

            const btn = document.getElementById('send-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const orderData = {
                customer: { name, phone, wilaya, delivery: shipType },
                items: cart,
                total: document.getElementById('cart-total').innerText,
                payment: document.getElementById('pay-method').value,
                status: 'New',
                createdAt: new Date().toISOString()
            };

            try {
                await db.collection('stores').doc(storeCode).collection('orders').add(orderData);
                alert("Order Sent Successfully!");
                cart = []; updateCart(); toggleCart(false);
            } catch (e) { alert("Error sending order"); }
            btn.innerText = "Send Order"; btn.disabled = false;
        }

        init();
    </script>
</body>
</html>
