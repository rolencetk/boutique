<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="store-title">Luxurio Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #000000;
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            transition: all 0.5s ease;
        }

        .font-vogue { font-family: 'Bodoni Moda', serif; }

        /* Navbar: 60% Transparency & Layout */
        nav {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
        }

        .nav-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 40px;
        }

        /* Logo Area in Middle */
        .logo-mid img {
            max-height: 60px;
            width: auto;
        }

        /* Hero / Header Section */
        .hero-section {
            padding: 160px 20px 100px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .hero-section h2 {
            color: var(--primary-color); /* يتغير حسب لوحة الإدارة */
        }

        /* Luxury Product Card */
        .img-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
            background: #fdfdfd;
        }
        .product-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 1s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .product-card:hover img { transform: scale(1.05); }

        .btn-add {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--primary-color);
            color: #fff; padding: 20px;
            font-size: 10px; letter-spacing: 3px;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }
        .product-card:hover .btn-add { transform: translateY(0); }

        /* Sidebar Cart (Italian Professional) */
        #cart-sidebar {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--bg-color);
            color: var(--text-color);
        }

        .checkout-btn {
            background: var(--primary-color);
            color: #fff;
            width: 100%; padding: 20px;
            font-size: 11px; letter-spacing: 4px;
            font-weight: 600;
        }

        /* Social Footer */
        .footer-social a {
            color: var(--text-color);
            font-size: 18px;
            transition: opacity 0.3s;
        }
        .footer-social a:hover { opacity: 0.5; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="text-left">
                <h1 id="nav-store-name" class="font-vogue text-xl font-bold tracking-tighter uppercase">Studio</h1>
            </div>

            <div class="logo-mid">
                <img id="store-logo" src="" alt="Logo" class="hidden">
            </div>

            <div class="text-right">
                <button onclick="toggleCart(true)" class="group flex items-center gap-3 justify-end w-full">
                    <span id="cart-count" class="text-[10px] font-bold uppercase tracking-[0.2em]">Bag (0)</span>
                    <i class="fa-solid fa-bag-shopping text-sm"></i>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <h2 id="header-store-name" class="font-vogue text-6xl md:text-9xl italic mb-6 uppercase tracking-tighter">Boutique</h2>
        <p id="store-bio" class="uppercase tracking-[0.5em] text-[10px] opacity-40 max-w-2xl mx-auto"></p>
    </header>

    <main class="container mx-auto px-10 py-32">
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
            </div>
    </main>

    <footer class="py-24 border-t border-gray-50 text-center">
        <div id="social-links" class="footer-social flex justify-center gap-12 mb-10">
            </div>
        <p class="text-[9px] uppercase tracking-[0.4em] opacity-30">&copy; <span id="year"></span> All Rights Reserved</p>
    </footer>

    <div id="cart-overlay" class="fixed inset-0 bg-black/10 hidden z-[900] backdrop-blur-sm" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 w-full max-w-md h-full z-[1000] translate-x-full p-12 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-16">
            <h2 class="font-vogue text-4xl italic tracking-tighter">Selection</h2>
            <button onclick="toggleCart(false)"><i class="fa-solid fa-xmark text-gray-300"></i></button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto pr-2">
            </div>

        <div class="mt-auto pt-10 border-t border-gray-100">
            <div class="flex justify-between items-center mb-8">
                <span class="text-[10px] uppercase tracking-widest opacity-40">Total Amount</span>
                <span id="cart-total" class="font-bold text-xl">0.00 USD</span>
            </div>
            <button onclick="checkout()" class="checkout-btn uppercase">Order via WhatsApp</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBEoyeQvUzFJviG2oYs5sZsAQ0bR9dHN0U",
          authDomain: "my-simple-stores.firebaseapp.com",
          projectId: "my-simple-stores",
          storageBucket: "my-simple-stores.firebasestorage.app",
          messagingSenderId: "280278183648",
          appId: "1:280278183648:web:65d99dceeab2be1584ea85"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const storeCode = urlParams.get('code');

        async function initStore() {
            if(!storeCode) return;
            db.collection('stores').doc(storeCode).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    
                    // 1. Dynamic Colors from Admin Panel
                    if(data.colors) {
                        document.documentElement.style.setProperty('--primary-color', data.colors.primary);
                        document.documentElement.style.setProperty('--bg-color', data.colors.background);
                        document.documentElement.style.setProperty('--text-color', data.colors.text);
                    }

                    // 2. Info & Logo
                    document.getElementById('nav-store-name').innerText = data.name || "Studio";
                    document.getElementById('header-store-name').innerText = data.name || "Boutique";
                    document.getElementById('store-bio').innerText = data.info?.bio || "";
                    
                    if(data.info?.logo) {
                        const logo = document.getElementById('store-logo');
                        logo.src = data.info.logo;
                        logo.classList.remove('hidden');
                    }

                    // 3. Social Links
                    const socialDiv = document.getElementById('social-links');
                    socialDiv.innerHTML = '';
                    if(data.info?.social) {
                        const s = data.info.social;
                        if(s.instagram) socialDiv.innerHTML += `<a href="${s.instagram}"><i class="fa-brands fa-instagram"></i></a>`;
                        if(s.facebook) socialDiv.innerHTML += `<a href="${s.facebook}"><i class="fa-brands fa-facebook"></i></a>`;
                        if(s.tiktok) socialDiv.innerHTML += `<a href="${s.tiktok}"><i class="fa-brands fa-tiktok"></i></a>`;
                    }
                    
                    loadProducts();
                }
            });
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const snap = await db.collection('stores').doc(storeCode).collection('products').get();
            grid.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                grid.innerHTML += `
                    <div class="product-card group cursor-pointer">
                        <div class="img-wrapper">
                            <img src="${p.image || ''}" alt="">
                            <button onclick="addToCart('${doc.id}', '${p.name}', ${p.price}, '${p.image}')" class="btn-add">ADD TO BAG +</button>
                        </div>
                        <div class="mt-8 text-center">
                            <h3 class="font-vogue text-2xl italic tracking-tight">${p.name}</h3>
                            <p class="text-[11px] font-bold opacity-30 mt-2">${p.price} USD</p>
                        </div>
                    </div>`;
            });
        }

        let cart = [];
        function addToCart(id, name, price, img) {
            const item = cart.find(i => i.id === id);
            item ? item.qty++ : cart.push({id, name, price, img, qty: 1});
            updateUI();
            toggleCart(true);
        }

        function updateUI() {
            const container = document.getElementById('cart-items');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += (item.price * item.qty);
                return `
                    <div class="flex gap-6 py-6 border-b border-gray-50 items-center">
                        <img src="${item.img}" class="w-20 h-28 object-cover">
                        <div class="flex-grow">
                            <h4 class="font-vogue text-lg italic">${item.name}</h4>
                            <p class="text-[10px] opacity-40 uppercase mt-1">${item.price} USD x ${item.qty}</p>
                            <button onclick="removeFromCart(${idx})" class="text-[9px] uppercase tracking-widest mt-4 border-b">Remove</button>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = total.toFixed(2) + " USD";
            document.getElementById('cart-count').innerText = `Bag (${cart.reduce((a, b) => a + b.qty, 0)})`;
        }

        function removeFromCart(i) { cart.splice(i, 1); updateUI(); }
        function toggleCart(s) {
            document.getElementById('cart-sidebar').style.transform = s ? "translateX(0)" : "translateX(100%)";
            document.getElementById('cart-overlay').classList.toggle('hidden', !s);
        }

        function checkout() {
            let msg = `New Order:\n`;
            cart.forEach(i => msg += `- ${i.name} (Qty: ${i.qty})\n`);
            msg += `\nTotal: ${document.getElementById('cart-total').innerText}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        }

        document.getElementById('year').innerText = new Date().getFullYear();
        initStore();
    </script>
</body>
</html>
