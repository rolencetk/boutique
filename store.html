<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #000000;
            --secondary: #333333;
            --background: #ffffff;
            --text: #1a1a1a;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .brand-info h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .brand-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .social-links {
            display: flex;
            gap: 0.5rem;
        }

        .social-link {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--background);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .cart-button {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: var(--radius);
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .cart-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 5rem 2rem;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            animation: fadeInUp 0.6s ease;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Categories */
        .categories-section {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 2rem;
        }

        .categories-scroll {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding: 1rem 0;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 0.7rem 1.5rem;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: var(--background);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Products */
        .products-section {
            max-width: 1400px;
            margin: 0 auto 4rem;
            padding: 0 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--background);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
        }

        .product-image-wrapper {
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.08);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .product-content {
            padding: 1.5rem;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .current-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .old-price {
            font-size: 1rem;
            color: var(--text-light);
            text-decoration: line-through;
        }

        .btn-add {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-add.added {
            background: #10b981;
        }

        /* Cart Modal */
        .cart-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: flex-end;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
        }

        .cart-modal.active {
            display: flex;
        }

        .cart-sidebar {
            background: var(--background);
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .cart-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .close-cart {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--background);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-cart:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
        }

        .cart-empty {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-light);
        }

        .cart-empty i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.2;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item-image {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--background);
            border: 1px solid var(--border);
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--background);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
        }

        .cart-item-remove:hover {
            text-decoration: underline;
        }

        .cart-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        .cart-summary {
            margin-bottom: 1.2rem;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: 700;
            padding-top: 0.6rem;
            border-top: 1px solid var(--border);
            margin-top: 0.6rem;
        }

        .delivery-select {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            background: var(--background);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delivery-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-checkout {
            width: 100%;
            padding: 1rem;
            background: #25D366;
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-checkout:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Footer */
        footer {
            background: var(--text);
            color: white;
            text-align: center;
            padding: 2.5rem;
            margin-top: 4rem;
        }

        footer p {
            opacity: 0.8;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar-container { padding: 1rem; }
            .hero { padding: 3rem 1rem; }
            .hero h2 { font-size: 1.8rem; }
            .categories-section, .products-section { padding: 0 1rem; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .product-image { height: 160px; }
            .product-content { padding: 1rem; }
            .cart-sidebar { max-width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <div class="brand-logo" id="storeLogo">S</div>
                <div class="brand-info">
                    <h1 id="storeName">Store</h1>
                    <p id="storeTagline">Best products with best prices</p>
                </div>
            </div>
            <div class="navbar-actions">
                <div class="social-links" id="socialLinks"></div>
                <button class="cart-button" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2 id="heroTitle">Welcome to Our Store</h2">
        <p id="heroDesc">Discover our amazing collection</p>
    </section>

    <!-- Categories -->
    <section class="categories-section">
        <div class="categories-scroll" id="categories">
            <button class="category-btn active" onclick="filterCategory('all')">All</button>
        </div>
    </section>

    <!-- Products -->
    <section class="products-section">
        <div class="section-header">
            <h2 class="section-title">Our Products</h2>
        </div>
        <div class="products-grid" id="productsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2024 <span id="footerName">Store</span> - All rights reserved</p>
    </footer>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h2>🛒 My Cart</h2>
                <button class="close-cart" onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-body" id="cartBody">
                <div class="cart-empty">
                    <i class="fas fa-shopping-bag"></i>
                    <p>Your cart is empty</p>
                </div>
            </div>
            <div class="cart-footer">
                <div class="cart-summary">
                    <div class="cart-row">
                        <span>Subtotal</span>
                        <span id="cartSubtotal">0 SAR</span>
                    </div>
                    <div class="cart-row">
                        <span>Delivery</span>
                        <span id="cartDelivery">0 SAR</span>
                    </div>
                    <div class="cart-row cart-total">
                        <span>Total</span>
                        <span id="cartTotal">0 SAR</span>
                    </div>
                </div>
                <select class="delivery-select" id="deliverySelect" onchange="updateCart()">
                    <option value="">Select delivery area</option>
                </select>
                <button class="btn-checkout" onclick="checkout()">
                    <i class="fab fa-whatsapp"></i>
                    Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeCode = urlParams.get('code');

        if (!storeCode) {
            document.getElementById('productsGrid').innerHTML = '<div class="loading"><p>Invalid store link</p></div>';
        }

        let storeData = null;
        let allProducts = [];
        let cart = [];

        async function loadStore() {
            try {
                const doc = await db.collection('stores').doc(storeCode).get();
                
                if (!doc.exists) {
                    document.getElementById('productsGrid').innerHTML = '<div class="loading"><p>Store not found</p></div>';
                    return;
                }

                storeData = doc.data();
                
                // Apply custom colors from dashboard
                if (storeData.colors) {
                    const root = document.documentElement;
                    if (storeData.colors.primary) root.style.setProperty('--primary', storeData.colors.primary);
                    if (storeData.colors.background) root.style.setProperty('--background', storeData.colors.background);
                    if (storeData.colors.text) root.style.setProperty('--text', storeData.colors.text);
                }

                document.title = storeData.name || 'Store';
                document.getElementById('storeName').textContent = storeData.name || 'Store';
                document.getElementById('storeTagline').textContent = storeData.info?.bio || 'Best products with best prices';
                document.getElementById('heroTitle').textContent = storeData.name || 'Welcome to Our Store';
                document.getElementById('heroDesc').textContent = storeData.info?.description || 'Discover our amazing collection';
                document.getElementById('footerName').textContent = storeData.name || 'Store';
                document.getElementById('storeLogo').textContent = storeData.name ? storeData.name.charAt(0).toUpperCase() : 'S';

                // Social links
                const social = storeData.info?.social || {};
                let socialHtml = '';
                if (social.facebook) socialHtml += `<a href="${social.facebook}" target="_blank" class="social-link"><i class="fab fa-facebook-f"></i></a>`;
                if (social.instagram) socialHtml += `<a href="${social.instagram}" target="_blank" class="social-link"><i class="fab fa-instagram"></i></a>`;
                if (social.tiktok) socialHtml += `<a href="${social.tiktok}" target="_blank" class="social-link"><i class="fab fa-tiktok"></i></a>`;
                document.getElementById('socialLinks').innerHTML = socialHtml;

                // Categories
                const cats = storeData.categories || [];
                const catContainer = document.getElementById('categories');
                catContainer.innerHTML = '<button class="category-btn active" onclick="filterCategory(\'all\')">All</button>';
                cats.forEach(c => {
                    catContainer.innerHTML += `<button class="category-btn" onclick="filterCategory('${c}')">${c}</button>`;
                });

                // Products
                const snapshot = await db.collection('stores').doc(storeCode).collection('products').get();
                allProducts = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                displayProducts(allProducts);
                
                // Delivery areas
                loadDeliveryAreas();

            } catch(err) {
                console.error(err);
                document.getElementById('productsGrid').innerHTML = '<div class="loading"><p>Error loading store</p></div>';
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="loading"><p>No products available</p></div>';
                return;
            }

            grid.innerHTML = products.map((p, index) => `
                <div class="product-card" style="animation-delay: ${index * 0.1}s">
                    <div class="product-image-wrapper">
                        <img src="${p.image || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22280%22><rect fill=%22%23f3f4f6%22 width=%22280%22 height=%22280%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2214%22>No Image</text></svg>'}" alt="${p.name}" class="product-image">
                        ${p.oldPrice ? '<span class="product-badge">SALE</span>' : ''}
                    </div>
                    <div class="product-content">
                        <div class="product-category">${p.category || 'General'}</div>
                        <h3 class="product-name">${p.name}</h3>
                        <div class="product-meta">${p.sizes ? 'Sizes: ' + p.sizes : ''} ${p.colors ? ' | Colors: ' + p.colors : ''}</div>
                        <div class="product-price">
                            ${p.oldPrice ? `<span class="old-price">${p.oldPrice} SAR</span>` : ''}
                            <span class="current-price">${p.price} SAR</span>
                        </div>
                        <button class="btn-add" id="btn-${p.id}" onclick="addToCart('${p.id}')">
                            <i class="fas fa-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                displayProducts(allProducts.filter(p => p.category === category));
            }
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({...product, qty: 1});
            }
            
            updateCartUI();
            
            // Button animation
            const btn = document.getElementById('btn-' + productId);
            if (btn) {
                btn.classList.add('added');
                btn.innerHTML = '<i class="fas fa-check"></i> Added!';
                setTimeout(() => {
                    btn.classList.remove('added');
                    btn.innerHTML = '<i class="fas fa-plus"></i> Add to Cart';
                }, 1500);
            }
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = totalItems;

            const cartBody = document.getElementById('cartBody');
            
            if (cart.length === 0) {
                cartBody.innerHTML = '<div class="cart-empty"><i class="fas fa-shopping-bag"></i><p>Your cart is empty</p></div>';
            } else {
                cartBody.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2290%22><rect fill=%22%23f3f4f6%22 width=%2290%22 height=%2290%22/></svg>'}" alt="${item.name}" class="cart-item-image">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${item.price} SAR</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                            </div>
                            <button class="cart-item-remove" onclick="removeFromCart('${item.id}')">Remove</button>
                        </div>
                    </div>
                `).join('');
            }

            updateCart();
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(productId);
            } else {
                updateCartUI();
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('active');
        }

        function loadDeliveryAreas() {
            const select = document.getElementById('deliverySelect');
            const delivery = storeData.delivery || {};
            
            select.innerHTML = '<option value="">Select delivery area</option>';
            
            Object.entries(delivery).forEach(([name, prices]) => {
                select.innerHTML += `<option value="${prices.home}" data-office="${prices.office}">${name} - Home: ${prices.home} SAR | Office: ${prices.office} SAR</option>`;
            });
        }

        function updateCart() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const select = document.getElementById('deliverySelect');
            const deliveryCost = select.value ? parseFloat(select.value) : 0;
            const total = subtotal + deliveryCost;

            document.getElementById('cartSubtotal').textContent = subtotal + ' SAR';
            document.getElementById('cartDelivery').textContent = deliveryCost + ' SAR';
            document.getElementById('cartTotal').textContent = total + ' SAR';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const select = document.getElementById('deliverySelect');
            if (!select.value) {
                alert('Please select delivery area!');
                return;
            }

            const areaName = select.options[select.selectedIndex].text.split(' - ')[0];
            const deliveryCost = parseFloat(select.value);
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = subtotal + deliveryCost;

            let message = `*🛒 New Order from ${storeData.name || 'Store'}*\n\n`;
            message += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            message += `*📦 Products:*\n`;
            cart.forEach(item => {
                message += `• ${item.name} x${item.qty} = ${item.price * item.qty} SAR\n`;
            });
            message += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            message += `📍 *Area:* ${areaName}\n`;
            message += `🚚 *Delivery:* ${deliveryCost} SAR\n`;
            message += `💰 *Subtotal:* ${subtotal} SAR\n`;
            message += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            message += `*💎 Total: ${total} SAR*`;

            const phone = '966500000000';
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Close modal on outside click
        document.getElementById('cartModal').addEventListener('click', function(e) {
            if (e.target === this) toggleCart();
        });

        // Load store
        loadStore();
    </script>
</body>
</html>
