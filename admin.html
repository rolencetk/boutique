<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المدير</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ═══════════════════════════════════════════════════
           تصميم لوحة التحكم
           ═══════════════════════════════════════════════════ */
        
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* القائمة الجانبية */
        .sidebar {
            width: 250px;
            background: var(--dark);
            color: var(--white);
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
        }
        
        .sidebar h2 {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            text-align: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li {
            margin-bottom: 0.5rem;
        }
        
        .sidebar-menu a {
            display: block;
            padding: 0.8rem 1rem;
            color: var(--white);
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: var(--primary);
        }
        
        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            margin-right: 250px;
            padding: 2rem;
            background: var(--light);
        }
        
        .page-title {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--dark);
        }
        
        /* البطاقات */
        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .card h3 {
            margin-bottom: 1.5rem;
            color: var(--primary);
        }
        
        /* النماذج */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* الأزرار */
        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        
        .btn-primary:hover {
            background: var(--secondary);
        }
        
        .btn-danger {
            background: #ef4444;
            color: var(--white);
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: #10b981;
            color: var(--white);
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        /* جدول المتاجر */
        .stores-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        .stores-table th,
        .stores-table td {
            padding: 1rem;
            text-align: right;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .stores-table th {
            background: var(--primary);
            color: var(--white);
        }
        
        .stores-table tr:hover {
            background: #f3f4f6;
        }
        
        .store-code {
            font-family: monospace;
            font-size: 0.9rem;
            background: #e5e7eb;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
        }
        
        .status-active {
            color: #10b981;
            font-weight: bold;
        }
        
        .status-inactive {
            color: #ef4444;
            font-weight: bold;
        }
        
        /* رسائل النجاح والخطأ */
        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        /* التجاوب */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .main-content {
                margin-right: 0;
            }
            
            .admin-container {
                flex-direction: column;
            }
        }
    </style>
</head>
