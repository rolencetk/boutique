<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ELEGANZA – Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- نفس الخط -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Inter', sans-serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }

    .hover-lift {
      transition: all .35s ease;
    }
    .hover-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
    }

    .fade-in {
      animation: fadeIn .6s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:none; }
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

<!-- Mobile Button -->
<button id="menuBtn"
  class="md:hidden fixed top-4 left-4 z-50 bg-black text-white p-3 rounded-lg">
  ☰
</button>

<!-- Sidebar -->
<aside id="sidebar"
  class="fixed md:static inset-y-0 left-0 w-72 bg-white border-r border-gray-200
         transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40">

  <div class="p-6 border-b border-gray-200 flex items-center gap-3">
    <div class="w-10 h-10 bg-black rounded-full"></div>
    <div>
      <h2 class="font-playfair text-xl font-bold">ELEGANZA</h2>
      <p class="text-xs text-gray-500 tracking-widest">ADMIN</p>
    </div>
  </div>

  <nav class="p-4 space-y-2">
    <a class="block px-4 py-3 rounded-lg bg-black text-white">Dashboard</a>
    <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Products</a>
    <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Categories</a>
    <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Shipping</a>
    <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Social Links</a>
    <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Store Settings</a>
  </nav>
</aside>

<!-- Overlay -->
<div id="overlay" class="fixed inset-0 bg-black/40 hidden z-30 md:hidden"></div>

<!-- Main -->
<main class="md:ml-72 p-6 fade-in">

  <!-- Header -->
  <header class="mb-10 flex justify-between items-center">
    <h1 class="font-playfair text-3xl font-bold">Dashboard</h1>
    <button class="px-6 py-3 bg-black text-white rounded-lg hover-lift">
      + Add Product
    </button>
  </header>

  <!-- Cards -->
  <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
    <div class="bg-white p-6 rounded-lg border hover-lift">
      <p class="text-gray-500 text-sm">Products</p>
      <h3 class="text-3xl font-bold mt-2">24</h3>
    </div>
    <div class="bg-white p-6 rounded-lg border hover-lift">
      <p class="text-gray-500 text-sm">Categories</p>
      <h3 class="text-3xl font-bold mt-2">6</h3>
    </div>
    <div class="bg-white p-6 rounded-lg border hover-lift">
      <p class="text-gray-500 text-sm">Orders</p>
      <h3 class="text-3xl font-bold mt-2">128</h3>
    </div>
  </section>

  <!-- Product Form (UI) -->
  <section class="bg-white border rounded-lg p-8">
    <h2 class="font-playfair text-2xl mb-6">Add / Edit Product</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <input class="border px-4 py-3 rounded-lg" placeholder="Product name" />
      <input class="border px-4 py-3 rounded-lg" placeholder="Price" />

      <input class="border px-4 py-3 rounded-lg" placeholder="Sizes (S, M, L)" />
      <input class="border px-4 py-3 rounded-lg" placeholder="Colors (Black, White)" />

      <input type="file" class="border px-4 py-3 rounded-lg md:col-span-2" />

      <textarea class="border px-4 py-3 rounded-lg md:col-span-2" rows="4"
        placeholder="Product description"></textarea>
    </div>

    <button class="mt-6 px-8 py-4 bg-black text-white rounded-lg hover-lift">
      Save Product
    </button>
  </section>

</main>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  menuBtn.onclick = () => {
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  };
  overlay.onclick = () => {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  };
</script>

</body>
</html>
