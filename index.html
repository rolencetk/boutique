<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <title>ELEGANZA – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Inter', sans-serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }

    .hover-lift {
      transition: all .3s ease;
    }
    .hover-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0,0,0,.15);
    }

    .fade-in {
      animation: fadeIn .6s ease-out forwards;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px)}
      to {opacity:1; transform:none}
    }
  </style>
</head>

<body class="h-full bg-gray-50 text-gray-900">
<div class="flex h-full">

  <!-- SIDEBAR -->
  <aside class="w-72 bg-white border-r border-gray-200 flex flex-col">
    <div class="p-6 flex items-center gap-3 border-b">
      <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        </svg>
      </div>
      <div>
        <h1 class="font-playfair text-xl font-bold">ELEGANZA</h1>
        <p class="text-xs text-gray-500 tracking-widest">ADMIN</p>
      </div>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a class="block px-4 py-3 rounded-lg bg-black text-white font-medium">Dashboard</a>
      <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Products</a>
      <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Orders</a>
      <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Customers</a>
      <a class="block px-4 py-3 rounded-lg hover:bg-gray-100">Settings</a>
    </nav>

    <div class="p-4 border-t">
      <button class="w-full py-3 border border-gray-300 rounded-lg hover:bg-gray-100">
        Logout
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-8 overflow-y-auto fade-in">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="font-playfair text-3xl font-bold">Dashboard</h2>
        <p class="text-gray-500">Welcome back, Admin</p>
      </div>
      <div class="flex gap-3">
        <button class="px-5 py-3 bg-black text-white rounded-lg hover-lift">
          + Add Product
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
      <div class="bg-white p-6 rounded-lg border hover-lift">
        <p class="text-sm text-gray-500">Total Sales</p>
        <h3 class="text-3xl font-bold">$12,450</h3>
      </div>
      <div class="bg-white p-6 rounded-lg border hover-lift">
        <p class="text-sm text-gray-500">Orders</p>
        <h3 class="text-3xl font-bold">184</h3>
      </div>
      <div class="bg-white p-6 rounded-lg border hover-lift">
        <p class="text-sm text-gray-500">Products</p>
        <h3 class="text-3xl font-bold">36</h3>
      </div>
      <div class="bg-white p-6 rounded-lg border hover-lift">
        <p class="text-sm text-gray-500">Customers</p>
        <h3 class="text-3xl font-bold">92</h3>
      </div>
    </div>

    <!-- PRODUCTS TABLE -->
    <div class="bg-white rounded-lg border overflow-hidden">
      <div class="p-6 border-b">
        <h3 class="font-playfair text-2xl">Latest Products</h3>
      </div>

      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600">
          <tr>
            <th class="p-4 text-left">Product</th>
            <th class="p-4">Price</th>
            <th class="p-4">Stock</th>
            <th class="p-4">Status</th>
            <th class="p-4"></th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t hover:bg-gray-50">
            <td class="p-4 font-medium">Premium Jacket</td>
            <td class="p-4">$349.99</td>
            <td class="p-4">18</td>
            <td class="p-4 text-green-600 font-semibold">Active</td>
            <td class="p-4 text-right">
              <button class="px-3 py-1 border rounded-lg hover:bg-gray-100">Edit</button>
            </td>
          </tr>
          <tr class="border-t hover:bg-gray-50">
            <td class="p-4 font-medium">Luxury Watch</td>
            <td class="p-4">$599.99</td>
            <td class="p-4">7</td>
            <td class="p-4 text-green-600 font-semibold">Active</td>
            <td class="p-4 text-right">
              <button class="px-3 py-1 border rounded-lg hover:bg-gray-100">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- SETTINGS -->
    <div class="mt-10 bg-white border rounded-lg p-8">
      <h3 class="font-playfair text-2xl mb-6">Store Settings</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm mb-2">Store Name</label>
          <input class="w-full border px-4 py-3 rounded-lg" value="ELEGANZA">
        </div>

        <div>
          <label class="block text-sm mb-2">Primary Color</label>
          <input type="color" value="#000000" class="w-full h-12 border rounded-lg">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm mb-2">Store Description</label>
          <textarea class="w-full border px-4 py-3 rounded-lg">Discover our premium collection of fashion and accessories</textarea>
        </div>
      </div>

      <button class="mt-6 px-8 py-4 bg-black text-white rounded-lg hover-lift">
        Save Changes
      </button>
    </div>

  </main>
</div>
</body>
</html>
