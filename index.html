<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة تحكم المتجر</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .fade { animation: fade .4s ease-out; }
    @keyframes fade {
      from { opacity:0; transform: translateY(10px);}
      to { opacity:1; transform:none;}
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-900">

<!-- ☰ زر الهاتف -->
<button id="menuBtn"
  class="md:hidden fixed top-4 right-4 z-50 bg-black text-white px-4 py-2 rounded-lg">
  ☰
</button>

<!-- Overlay -->
<div id="overlay" class="fixed inset-0 bg-black/40 hidden z-30 md:hidden"></div>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar"
    class="fixed md:static right-0 top-0 h-full w-72 bg-white border-l
           transform translate-x-full md:translate-x-0
           transition-transform duration-300 z-40">

    <div class="p-6 border-b">
      <div class="flex items-center gap-3">
        <img id="logoPreview"
          src="https://via.placeholder.com/60"
          class="w-12 h-12 rounded-full object-cover">
        <div>
          <h1 class="font-bold text-lg">متجري</h1>
          <p class="text-xs text-gray-500">لوحة التحكم</p>
        </div>
      </div>
      <input type="file" accept="image/*"
        class="mt-3 text-xs"
        onchange="changeLogo(event)">
    </div>

    <nav class="p-4 space-y-2 text-sm">
      <button onclick="showSection('products')" class="block w-full text-right px-4 py-3 rounded hover:bg-gray-100">📦 المنتجات</button>
      <button onclick="showSection('categories')" class="block w-full text-right px-4 py-3 rounded hover:bg-gray-100">🗂 الأقسام</button>
      <button onclick="showSection('delivery')" class="block w-full text-right px-4 py-3 rounded hover:bg-gray-100">🚚 التوصيل</button>
      <button onclick="showSection('social')" class="block w-full text-right px-4 py-3 rounded hover:bg-gray-100">🌐 التواصل</button>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-6 md:p-10 fade">

    <!-- PRODUCTS -->
    <section id="products">
      <h2 class="text-2xl font-bold mb-6">إضافة منتج</h2>

      <div class="grid md:grid-cols-2 gap-6 bg-white p-6 rounded-lg border">

        <input placeholder="اسم المنتج" class="border p-3 rounded">
        <input type="number" placeholder="السعر" class="border p-3 rounded">

        <input placeholder="المقاسات (S,M,L)" class="border p-3 rounded">
        <input placeholder="الألوان (أسود، أبيض)" class="border p-3 rounded">

        <select class="border p-3 rounded">
          <option>ملابس</option>
          <option>إكسسوارات</option>
          <option>أحذية</option>
        </select>

        <input type="file" multiple accept="image/*" class="border p-3 rounded">

        <button class="md:col-span-2 bg-black text-white py-3 rounded">
          إضافة المنتج
        </button>
      </div>
    </section>

    <!-- CATEGORIES -->
    <section id="categories" class="hidden">
      <h2 class="text-2xl font-bold mb-6">الأقسام</h2>
      <div class="bg-white p-6 rounded border">
        <input placeholder="اسم القسم الجديد" class="border p-3 rounded w-full mb-4">
        <button class="bg-black text-white px-6 py-3 rounded">إضافة قسم</button>
      </div>
    </section>

    <!-- DELIVERY -->
    <section id="delivery" class="hidden">
      <h2 class="text-2xl font-bold mb-6">التوصيل</h2>
      <div class="bg-white p-6 rounded border grid md:grid-cols-2 gap-4">
        <input placeholder="الولاية" class="border p-3 rounded">
        <input type="number" placeholder="سعر التوصيل" class="border p-3 rounded">
        <button class="md:col-span-2 bg-black text-white py-3 rounded">
          حفظ
        </button>
      </div>
    </section>

    <!-- SOCIAL -->
    <section id="social" class="hidden">
      <h2 class="text-2xl font-bold mb-6">روابط التواصل</h2>
      <div class="bg-white p-6 rounded border grid gap-4">
        <input placeholder="Instagram" class="border p-3 rounded">
        <input placeholder="Facebook" class="border p-3 rounded">
        <input placeholder="TikTok" class="border p-3 rounded">
        <button class="bg-black text-white py-3 rounded">حفظ الروابط</button>
      </div>
    </section>

  </main>
</div>

<!-- JS -->
<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  menuBtn.onclick = () => {
    sidebar.classList.toggle('translate-x-full');
    overlay.classList.toggle('hidden');
  };

  overlay.onclick = () => {
    sidebar.classList.add('translate-x-full');
    overlay.classList.add('hidden');
  };

  function showSection(id) {
    document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function changeLogo(e) {
    const file = e.target.files[0];
    if (file) {
      document.getElementById('logoPreview').src = URL.createObjectURL(file);
    }
  }
</script>

</body>
</html>
